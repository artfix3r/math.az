# Render Blueprint for math.az
# When you connect this repo on Render, it reads this file and configures everything.
# See .env.example for what each variable does.
services:
  - type: web
    name: math-az
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Postgres connection string (e.g. from Supabase, Neon or Render Postgres).
      - key: DATABASE_URL
        sync: false
      # Signs login cookies; Render generates a random value once.
      - key: SESSION_SECRET
        generateValue: true
      # Code required to sign up as a teacher. Leave unset to close teacher sign-up.
      - key: TEACHER_SIGNUP_CODE
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
